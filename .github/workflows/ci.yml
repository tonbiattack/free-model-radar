name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# PR では公開しない。main への push と手動実行だけがデプロイ対象。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 検証とビルド
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 依存関係をインストール
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: データを検証して生成
        run: npm run build:data

      - name: 生成物に差分がないこと（手元での生成し忘れ防止）
        run: |
          if ! git diff --quiet -- src/generated; then
            echo "::error::src/generated/dataset.json が data/ と一致していません。npm run build:data を実行してコミットしてください。"
            git diff --stat -- src/generated
            exit 1
          fi

      - name: テスト
        run: npm test

      - name: ビルド
        run: npm run build

      - name: Pages 用の成果物をアップロード
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: GitHub Pages へ公開
    # PR では動かさない。検証が通った main のコミットだけを公開する。
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
